<div class="container">
  <p class="breadcrumb"><a href="index.html" data-i18n="home">Home</a> / <span data-i18n="your_bag">Shopping Bag</span></p>
  <div class="page-hero" style="padding-top:0;padding-bottom:var(--space-3);">
    <h1 data-i18n="your_bag">Your Bag</h1>
  </div>

  <div class="cart-layout">
    <div data-cart-page></div>
    <div class="summary-card" data-cart-summary>
      <h3 data-i18n="order_summary">Order Summary</h3>
      <div class="summary-row"><span data-i18n="subtotal">Subtotal</span><span data-subtotal>€0</span></div>
      <div class="summary-row"><span data-i18n="shipping">Shipping</span><span data-shipping>Free</span></div>
      <form class="promo-row" data-demo-form="toast_promo_applied">
        <input type="text" placeholder="Promo code" data-i18n-placeholder="promo_placeholder" aria-label="Promo code">
        <button type="submit" class="btn btn-outline" data-i18n="apply">Apply</button>
      </form>
      <div class="summary-row total"><span data-i18n="total">Total</span><span data-total>€0</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block" data-i18n="proceed_checkout">Proceed to Checkout</a>
      <a href="shop.html" class="btn btn-ghost btn-block" style="justify-content:center;margin-top:.6em;" data-i18n="continue_shopping">Continue Shopping</a>
    </div>
  </div>
</div>
