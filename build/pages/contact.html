<div class="container">
  <p class="breadcrumb"><a href="index.html" data-i18n="home">Home</a> / <span data-i18n="footer_contact2">Contact</span></p>
  <div class="page-hero" style="padding-top:0;">
    <h1 data-i18n="contact_title">Contact Us</h1>
    <p data-i18n="contact_text">Our client care team is available to help with orders, sizing and general enquiries.</p>
  </div>

  <div class="contact-grid">
    <div>
      <h3 style="font-size:var(--fs-md);margin-bottom:var(--space-2);" data-i18n="send_message">Send a Message</h3>
      <form data-demo-form="toast_message_sent">
        <div class="form-grid two" style="margin-bottom:var(--space-2);">
          <div class="field"><label for="ct-name" data-i18n="name">Name</label><input id="ct-name" type="text" required></div>
          <div class="field"><label for="ct-email" data-i18n="email">Email</label><input id="ct-email" type="email" required></div>
        </div>
        <div class="field" style="margin-bottom:var(--space-2);"><label for="ct-subject" data-i18n="subject">Subject</label><input id="ct-subject" type="text"></div>
        <div class="field" style="margin-bottom:var(--space-3);"><label for="ct-msg" data-i18n="message">Message</label><textarea id="ct-msg" rows="5" required></textarea></div>
        <button type="submit" class="btn btn-primary" data-i18n="send_message_btn">Send Message</button>
      </form>
    </div>
    <div>
      <h3 style="font-size:var(--fs-md);margin-bottom:var(--space-2);" data-i18n="client_care">Client Care</h3>
      <dl class="info-list">
        <dt data-i18n="email">Email</dt><dd>care@benzcomilano.com</dd>
        <dt data-i18n="phone">Phone</dt><dd>+39 02 1234 5678</dd>
        <dt data-i18n="hours">Hours</dt><dd data-i18n="hours_value">Monday – Friday, 9:00 – 18:00 CET</dd>
        <dt data-i18n="flagship">Flagship Boutique</dt><dd data-i18n="flagship_value">Via Montenapoleone 12, 20121 Milano, Italy</dd>
      </dl>
    </div>
  </div>
</div>
