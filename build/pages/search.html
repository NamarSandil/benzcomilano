<div class="container">
  <div class="page-hero" style="padding-top:var(--space-4);padding-bottom:0;">
    <h1 data-i18n="search_title">Search</h1>
  </div>
  <div class="section-pad" style="padding-block:var(--space-4);">
    <form class="search-bar-page" onsubmit="return false;">
      <input type="search" data-search-input placeholder="Search for products..." data-i18n-placeholder="search_placeholder" aria-label="Search products">
    </form>
    <p class="count" data-search-count style="display:block;margin-bottom:var(--space-3);"></p>
    <div class="product-grid" data-search-grid></div>
  </div>
</div>
