<div class="container">
  <p class="breadcrumb"><a href="index.html" data-i18n="home">Home</a> / <span data-i18n="nav_men">Men</span></p>
  <div class="page-hero" style="padding-top:0;">
    <h1 data-i18n="men_title">Men</h1>
    <p data-i18n="men_text">Tailored outerwear, knitwear and accessories, cut with Italian precision.</p>
  </div>

  <div class="toolbar">
    <button class="btn btn-ghost" data-open="filters" data-i18n="filters" style="border:1px solid var(--c-line);padding:.7em 1.4em;">Filters</button>
    <span class="count" data-result-count></span>
    <div class="toolbar-actions">
      <select class="select-native" data-sort aria-label="Sort products">
        <option value="newest" data-i18n="sort_newest">Newest</option>
        <option value="price-asc" data-i18n="sort_price_asc">Price: Low to High</option>
        <option value="price-desc" data-i18n="sort_price_desc">Price: High to Low</option>
        <option value="popular" data-i18n="sort_popular">Most Popular</option>
      </select>
    </div>
  </div>

  <div class="product-grid" data-listing-grid data-category="men"></div>
</div>

<div class="overlay" data-for="filters"></div>
<aside class="filter-drawer" aria-label="Filters">
  <div class="drawer-head">
    <h3 data-i18n="filters">Filters</h3>
    <button class="btn-icon" data-close="filters" aria-label="Close filters">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <form class="drawer-body" data-filter-form>
    <details class="filter-group" open>
      <summary data-i18n="size">Size</summary>
      <div class="filter-option"><label><input type="checkbox" data-filter-size value="S"> S</label></div>
      <div class="filter-option"><label><input type="checkbox" data-filter-size value="M"> M</label></div>
      <div class="filter-option"><label><input type="checkbox" data-filter-size value="L"> L</label></div>
      <div class="filter-option"><label><input type="checkbox" data-filter-size value="XL"> XL</label></div>
    </details>
    <details class="filter-group" open>
      <summary data-i18n="color">Color</summary>
      <div class="swatch-row">
        <button type="button" class="swatch-btn" style="background:#0e0e0d" data-filter-color="black" title="Black"></button>
        <button type="button" class="swatch-btn" style="background:#ded4c3" data-filter-color="beige" title="Beige"></button>
        <button type="button" class="swatch-btn" style="background:#4b463f" data-filter-color="charcoal" title="Charcoal"></button>
        <button type="button" class="swatch-btn" style="background:#b08d5e" data-filter-color="camel" title="Camel"></button>
        <button type="button" class="swatch-btn" style="background:#232a35" data-filter-color="navy" title="Navy"></button>
      </div>
    </details>
    <details class="filter-group" open>
      <summary data-i18n="price">Price</summary>
      <input type="range" min="150" max="1400" value="1400" data-filter-price style="width:100%;">
      <p style="font-size:var(--fs-sm);color:var(--c-gray-700);"><span data-i18n="up_to">Up to</span> <span data-price-output>€1,400</span></p>
    </details>
  </form>
  <div class="drawer-foot">
    <button class="btn btn-primary btn-block" data-close="filters" data-i18n="view_results">View Results</button>
  </div>
</aside>
